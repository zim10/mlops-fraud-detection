# monitoring/prometheus_drift/docker-compose.yml
version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://fraud:password@postgres:5432/fraud_detection
    depends_on:
      - postgres
    networks:
      - drift-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=fraud
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=fraud_detection
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - drift-network

  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - drift-network

  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - drift-network

networks:
  drift-network:
    driver: bridge

volumes:
  postgres-data:
  grafana-data: