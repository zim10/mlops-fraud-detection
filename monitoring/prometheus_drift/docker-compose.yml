# monitoring/prometheus_drift/docker-compose.yml
version: '3.8'
services:
  churn-api:
    build: .
    ports: ["8000:8000"]
    depends_on: [postgres]
    networks: [app-network]

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: my_user
      POSTGRES_PASSWORD: my_password
      POSTGRES_DB: my_db
    ports: ["5432:5432"]
    networks: [app-network]

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml]
    networks: [app-network]

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks: [app-network]

networks:
  app-network:
    driver: bridge